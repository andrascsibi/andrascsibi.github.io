<!DOCTYPE html>
<html lang="{{ site.lang | default: "hu" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
    <link rel="preload" href="{{ "/assets/fonts/literata-normal-latin.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ "/assets/css/fonts.css" | relative_url }}">
    {% include clean-url.html %}
    <link rel="stylesheet" href="{{ "/assets/css/post.css" | relative_url }}">
  </head>
  <body>
    <article>
      <nav><a href="{{ "/" | relative_url }}">{{ site.title }}</a></nav>
      <header>
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y. %m. %d." }}</time>
        <h1>{{ page.title }}</h1>
      </header>

      {{ content }}

      <footer><a href="{{ "/" | relative_url }}">← Főoldal</a></footer>
    </article>
    {% include new-tab-links.html %}
  </body>
</html>
