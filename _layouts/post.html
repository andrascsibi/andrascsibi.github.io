<!DOCTYPE html>
<html lang="{{ site.lang | default: "hu" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&display=swap">
    <link rel="stylesheet" href="{{ "/assets/css/post.css" | relative_url }}">
  </head>
  <body>
    <article>
      <nav><a href="{{ "/" | relative_url }}">{{ site.title }}</a></nav>
      <header>
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y. %m. %d." }}</time>
        <h1>{{ page.title }}</h1>
      </header>

      {{ content }}

      <footer><a href="{{ "/" | relative_url }}">← Főoldal</a></footer>
    </article>
    {% include new-tab-links.html %}
  </body>
</html>
